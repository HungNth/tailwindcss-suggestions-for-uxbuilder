<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="tailwind.css">
</head>
<body>
  <!-- Spacing utilities -->
  <div class="p-0 p-1 p-2 p-3 p-4 p-5 p-6 p-8 p-10 p-12 p-16 p-20 p-24 p-32"></div>
  <div class="px-0 px-1 px-2 px-3 px-4 px-6 px-8 py-0 py-1 py-2 py-4 py-8"></div>
  <div class="m-0 m-1 m-2 m-3 m-4 m-5 m-6 m-8 m-10 m-auto mx-auto my-auto"></div>
  <div class="pt-1 pr-2 pb-3 pl-4 mt-1 mr-2 mb-3 ml-4"></div>
  
  <!-- Colors - Background -->
  <div class="bg-black bg-white bg-gray-50 bg-gray-100 bg-gray-200 bg-gray-300"></div>
  <div class="bg-gray-400 bg-gray-500 bg-gray-600 bg-gray-700 bg-gray-800 bg-gray-900"></div>
  <div class="bg-red-50 bg-red-100 bg-red-500 bg-red-600 bg-red-700"></div>
  <div class="bg-blue-50 bg-blue-100 bg-blue-500 bg-blue-600 bg-blue-700"></div>
  <div class="bg-green-50 bg-green-500 bg-green-600 bg-yellow-500 bg-purple-500"></div>
  <div class="bg-transparent bg-current"></div>
  
  <!-- Colors - Text -->
  <div class="text-black text-white text-gray-500 text-gray-700 text-gray-900"></div>
  <div class="text-red-500 text-blue-500 text-green-500 text-yellow-500"></div>
  
  <!-- Flexbox -->
  <div class="flex inline-flex flex-row flex-col flex-wrap flex-nowrap"></div>
  <div class="justify-start justify-center justify-end justify-between justify-around"></div>
  <div class="items-start items-center items-end items-stretch items-baseline"></div>
  <div class="flex-1 flex-auto flex-initial flex-none"></div>
  <div class="gap-0 gap-1 gap-2 gap-3 gap-4 gap-6 gap-8"></div>
  
  <!-- Grid -->
  <div class="grid inline-grid grid-cols-1 grid-cols-2 grid-cols-3 grid-cols-4"></div>
  <div class="grid-cols-6 grid-cols-12 col-span-1 col-span-2 col-span-full"></div>
  
  <!-- Sizing -->
  <div class="w-0 w-1 w-2 w-4 w-8 w-12 w-16 w-20 w-24 w-32 w-auto w-full"></div>
  <div class="h-0 h-1 h-2 h-4 h-8 h-12 h-16 h-20 h-screen h-full h-auto"></div>
  <div class="min-w-0 min-w-full max-w-xs max-w-sm max-w-md max-w-lg"></div>
  <div class="min-h-0 min-h-full max-h-screen"></div>
  
  <!-- Typography -->
  <div class="text-xs text-sm text-base text-lg text-xl text-2xl text-3xl"></div>
  <div class="font-thin font-light font-normal font-medium font-semibold font-bold"></div>
  <div class="leading-none leading-tight leading-normal leading-loose"></div>
  <div class="text-left text-center text-right text-justify"></div>
  <div class="uppercase lowercase capitalize normal-case"></div>
  <div class="underline line-through no-underline"></div>
  
  <!-- Borders -->
  <div class="border border-0 border-2 border-4 border-8"></div>
  <div class="border-t border-r border-b border-l"></div>
  <div class="border-gray-200 border-gray-300 border-black border-white"></div>
  <div class="rounded rounded-sm rounded-md rounded-lg rounded-full rounded-none"></div>
  <div class="rounded-t rounded-r rounded-b rounded-l"></div>
  
  <!-- Display -->
  <div class="block inline-block inline hidden"></div>
  
  <!-- Position -->
  <div class="static fixed absolute relative sticky"></div>
  <div class="top-0 right-0 bottom-0 left-0 inset-0"></div>
  <div class="z-0 z-10 z-20 z-30 z-40 z-50 z-auto"></div>
  
  <!-- Opacity -->
  <div class="opacity-0 opacity-25 opacity-50 opacity-75 opacity-100"></div>
  
  <!-- Shadow -->
  <div class="shadow shadow-sm shadow-md shadow-lg shadow-xl shadow-none"></div>
  
  <!-- Cursor -->
  <div class="cursor-auto cursor-pointer cursor-not-allowed cursor-move"></div>
  
  <!-- Overflow -->
  <div class="overflow-auto overflow-hidden overflow-visible overflow-scroll"></div>
  <div class="overflow-x-auto overflow-y-auto"></div>
  
  <!-- Transitions -->
  <div class="transition transition-all transition-colors transition-opacity"></div>
  <div class="duration-75 duration-100 duration-150 duration-200 duration-300"></div>
  <div class="ease-linear ease-in ease-out ease-in-out"></div>
  
  <!-- Transform -->
  <div class="scale-0 scale-50 scale-75 scale-90 scale-95 scale-100"></div>
  <div class="rotate-0 rotate-45 rotate-90 rotate-180"></div>
  
  <!-- Hover states -->
  <div class="hover:bg-blue-500 hover:text-white hover:opacity-75"></div>
  
  <!-- Focus states -->
  <div class="focus:outline-none focus:ring focus:ring-blue-500"></div>
</body>
</html>
